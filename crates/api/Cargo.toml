[package]
name = "fleetpulse-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "HTTP API: routes, middleware, DTOs."

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
fleetpulse-store = { version = "0.1.0", path = "../store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
tower-http = { version = "0.6", features = ["trace", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
validator = { version = "0.20", features = ["derive"] }

[dev-dependencies]
argon2 = { version = "0.5", features = ["std"] }
http-body-util = "0.1"
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
tower = { version = "0.5", features = ["util"] }
