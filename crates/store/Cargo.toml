[package]
name = "fleetpulse-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Postgres persistence layer."

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }
fleetpulse-domain.workspace = true
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
