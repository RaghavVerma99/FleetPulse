name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fleetpulse
          POSTGRES_PASSWORD: fleetpulse
          POSTGRES_DB: fleetpulse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fleetpulse -d fleetpulse_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://fleetpulse:fleetpulse@localhost:5432/fleetpulse_test
      TEST_DATABASE_URL: postgres://fleetpulse:fleetpulse@localhost:5432/fleetpulse_test

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (unit, no database required)
        run: cargo test --workspace

      - name: Test (DB-backed integration)
        run: cargo test --workspace -- --ignored
